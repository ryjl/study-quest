[project]
name = "sq-whisper-worker"
version = "0.1.0"
description = "Subtitle-generation worker for the StudyQuest subtitle queue (faster-whisper on a local GPU)."
requires-python = ">=3.12"
dependencies = [
    # faster-whisper pulls ctranslate2, but ctranslate2 does NOT declare the
    # CUDA shared libs it dlopens at runtime (libcublas, libcudart, ...). On a
    # host without a full CUDA toolkit (e.g. WSL2 driver-only), the nvidia-*-cu12
    # pip wheels provide them; worker.py adds their lib dirs to LD_LIBRARY_PATH
    # before importing ctranslate2.
    "faster-whisper>=1.1,<2",
    "nvidia-cublas-cu12>=12",
    "nvidia-cuda-runtime-cu12>=12",
    "nvidia-cufft-cu12>=12",
    "nvidia-cuda-nvrtc-cu12>=12",
    "nvidia-nvjitlink-cu12>=12",
    "requests>=2.32,<3",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["*.py"]
