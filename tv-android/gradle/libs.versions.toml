# Version catalog for StudyQuest TV.
#
# 工具链版本对齐 frontend/ Flutter Android 工程(同 monorepo 统一管理):
#   Gradle 9.1.0 / AGP 9.0.1 / Kotlin 2.3.10 / compileSdk 36
# 注意:frontend 用 Kotlin 2.3.20,但 KSP 还没出 2.3.20 的版本(滞后于 Kotlin 主版本),
# 所以 TV 端降到 KSP 最新支持的 2.3.10。差一个 patch 版本,工具链基本对齐。
# KSP 新版命名改为纯 Kotlin 版本号(旧版是 <kotlin>-<ksp> 如 2.0.x 系),现在是 2.3.10。
# TV 端特有:tv-material(Compose for TV)/ media3(ExoPlayer)/ hilt。
# 参考范例 Google JetStreamCompose(android/tv-samples)。

[versions]
agp = "9.0.1"
kotlin = "2.3.10"
ksp = "2.3.10"

# Compose & TV
composeBom = "2025.02.00"
tvMaterial = "1.0.0"
activityCompose = "1.10.1"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
navigationCompose = "2.8.8"
splashscreen = "1.0.1"

# Media (ExoPlayer)
media3 = "1.6.0-beta01"

# DI & 网络
# Hilt 升到 2.60:2.54 用旧 BaseExtension API,不兼容 AGP 9.0(AGP 9 移除了 BaseExtension)。
hilt = "2.60"
hiltNavigationCompose = "1.2.0"
retrofit = "2.11.0"
okhttp = "4.12.0"
kotlinxSerialization = "1.8.0"
retrofitKotlinxConverter = "1.0.0"

# 图片
coil = "2.7.0"

# 加密存储
securityCrypto = "1.1.0-alpha06"

# 测试
junit = "4.13.2"
androidxJunit = "1.2.1"

[libraries]
# Compose & TV
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-tv-material = { group = "androidx.tv", name = "tv-material", version.ref = "tvMaterial" }

# Media3 ExoPlayer
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-ui-compose = { group = "androidx.media3", name = "media3-ui-compose", version.ref = "media3" }
androidx-media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }

# DI
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# 网络
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization-converter = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofitKotlinxConverter" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# 图片
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# 加密存储(token 持久化)
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

# 测试
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# kotlin-android 不需要:AGP 9.0 内置 Kotlin 支持。
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
