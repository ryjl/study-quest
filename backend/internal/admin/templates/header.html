{{ define "header.html" }}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyQuest 管理后台</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
            display: flex;
            min-height: 100vh;
        }
        
        /* Sidebar Navigation */
        .sidebar {
            width: 260px;
            background-color: #111827;
            border-right: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            position: fixed;
            height: 100vh;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 2.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(to right, #a78bfa, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex: 1;
        }
        .nav-links a {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            color: #9ca3af;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .nav-links a:hover {
            color: #ffffff;
            background-color: #1f2937;
        }
        .nav-links li.active a {
            color: #ffffff;
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            box-shadow: 0 4px 6px -1px rgba(124, 58, 237, 0.3);
        }
        .logout-btn {
            margin-top: auto;
            color: #ef4444;
            text-decoration: none;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            font-weight: 500;
            display: flex;
            align-items: center;
            transition: background-color 0.2s;
        }
        .logout-btn:hover {
            background-color: rgba(239, 68, 68, 0.1);
        }

        /* Main Content Panel */
        .main-panel {
            margin-left: 260px;
            flex: 1;
            padding: 2.5rem;
            background-color: #0b0f19;
            min-height: 100vh;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #ffffff;
        }

        /* Cards & Styling Elements */
        .card {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
            border-bottom: 1px solid #1f2937;
            padding-bottom: 0.75rem;
        }
        .card-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: #f3f4f6;
        }

        /* Buttons & Forms */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.625rem 1.25rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.875rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            color: #ffffff;
            box-shadow: 0 2px 4px rgba(124, 58, 237, 0.2);
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
        }
        .btn-secondary {
            background-color: #374151;
            color: #f3f4f6;
        }
        .btn-secondary:hover {
            background-color: #4b5563;
        }
        .btn-danger {
            background-color: #ef4444;
            color: white;
        }
        .btn-danger:hover {
            background-color: #dc2626;
        }

        /* Common table styles */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0.5rem;
        }
        th, td {
            text-align: left;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #1f2937;
        }
        th {
            color: #9ca3af;
            font-weight: 600;
            font-size: 0.875rem;
        }
        td {
            color: #d1d5db;
            font-size: 0.9375rem;
        }
        tr:hover td {
            background-color: #1f2937;
        }

        /* Input inputs */
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            font-size: 0.875rem;
            color: #9ca3af;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        .form-control {
            width: 100%;
            padding: 0.625rem 0.875rem;
            border-radius: 10px;
            background-color: #1f2937;
            border: 1px solid #374151;
            color: #ffffff;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-control:focus {
            border-color: #8b5cf6;
        }
        
        /* Grid layouts */
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        /* Badge styling */
        .badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-student { background-color: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        .badge-teen { background-color: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .badge-parent { background-color: rgba(16, 185, 129, 0.2); color: #34d399; }
        .badge-admin { background-color: rgba(139, 92, 246, 0.2); color: #a78bfa; }
    </style>
</head>
<body>
{{ end }}
