name: study_quest
description: StudyQuest learning platform Android PAD and TV client application.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.0
  screen_brightness: ^0.2.2
  google_fonts: ^6.1.0
  provider: ^6.0.5

  # Video playback core — media_kit (libmpv-based) replaces video_player for
  # broader codec support, hardware decoding, and native subtitle/audio track
  # selection which are essential for netdisk video streaming.
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_android_video: ^1.3.6

  # PDF viewer for in-app 讲义 preview. We use pdfrx (pdfium-backed) instead
  # of syncfusion_flutter_pdfviewer because the latter is incompatible with
  # AGP 9.x (NPE in its build script) and carries a commercial license.
  pdfrx: ^1.0.121

  # Open attachments in external app / download.
  url_launcher: ^6.2.6

  # Read the app's version_code / version_name at runtime, for the OTA
  # self-update check (compares installed build number vs. server's latest).
  package_info_plus: ^8.0.0

  # Read the OS-level device name (e.g. "客厅 iPad", "Android TV") so the admin
  # device-session list can show a friendly label. Sent once at login.
  device_info_plus: ^10.1.0

  # Resolve app-internal directories for staging a downloaded APK update. We
  # write the APK under the documents dir, which the FileProvider maps (see
  # res/xml/file_paths.xml) so the system installer can read it via content://.
  path_provider: ^2.1.0

  # WebView for the reading room's web articles (公众号 H5 etc.). Uses the
  # official webview_flutter package (AGP 9 compatible). Its NavigationDelegate
  # .onNavigationRequest → NavigationDecision.prevent is the equivalent of
  # Android's shouldOverrideUrlLoading for domain-whitelist interception.
  # (flutter_inappwebview 1.1.3 is incompatible with AGP 9 — its build.gradle
  # uses the deprecated proguard-android.txt, see issue #2765.)
  webview_flutter: ^4.13.0

  # PDF native printing via Android's PrintManager. Only used for the reading
  # room's "print PDF" button (试卷/绘本 → 纸质).
  printing: ^5.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#19033f"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
